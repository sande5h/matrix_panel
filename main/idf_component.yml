dependencies:
  idf:
    version: ">=6.0"
  # cJSON left IDF core in v6 and is a managed component now, which is why
  # REQUIRES "json" no longer resolves. Same spec the claude_usage_c3 project
  # uses. Fetched automatically on the next build.
  espressif/cjson:
    version: "*"
  # Lets the panel answer to matrix-panel.local, so the menu bar script does
  # not need a DHCP address that moves.
  espressif/mdns:
    version: "*"
